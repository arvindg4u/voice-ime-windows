name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # This is the ONLY place full GUI-level coverage runs: the suite targets
      # net8.0-windows and STA view tests construct real WPF controls, which
      # need the Windows-only desktop runtime. On Linux `dotnet build` works
      # (EnableWindowsTargeting) but `dotnet test` cannot execute — only
      # compile + OS-independent logic is provable there.
      - name: Run unit tests
        timeout-minutes: 10
        run: dotnet test VoiceIme.Windows.sln -c Release --blame-hang --blame-hang-timeout 5m

      - name: Publish single-file EXE
        run: >
          dotnet publish src/VoiceIme/VoiceIme.csproj -c Release
          -r win-x64 --self-contained
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # Inno Setup is preinstalled on windows-latest runners. The installer
      # wraps the same single-file EXE with Start-menu shortcut, per-user
      # install (no admin) and a clean uninstaller.
      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\VoiceIme.iss

      - name: Upload EXE artifact (portable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-ime-windows
          path: publish/VoiceIme.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-ime-windows-setup
          path: installer/Output/VoiceIme-Setup-*.exe
