name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Run unit tests
        timeout-minutes: 10
        run: dotnet test VoiceIme.Windows.sln -c Release --blame-hang --blame-hang-timeout 5m

      - name: Publish single-file EXE
        run: >
          dotnet publish src/VoiceIme/VoiceIme.csproj -c Release
          -r win-x64 --self-contained
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-ime-windows
          path: publish/VoiceIme.exe
